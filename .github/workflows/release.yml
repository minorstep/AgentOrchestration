name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest, and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as pyproject:
              package_version = tomllib.load(pyproject)["project"]["version"]

          if tag_version != package_version:
              raise SystemExit(
                  f"tag version {tag_version} does not match "
                  f"package version {package_version}"
              )
          PY

      - name: Build Python packages
        run: python -m build --sdist --wheel --outdir dist

      - name: Add source archive and digest manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive \
            --format=tar.gz \
            --prefix="agent-orchestrator-${version}/" \
            -o "dist/agent-orchestrator-${version}-source.tar.gz" \
            HEAD
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Generate provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          Release artifacts for ${GITHUB_REF_NAME}

          Source commit: ${GITHUB_SHA}
          Build workflow: ${GITHUB_WORKFLOW}

          Each uploaded package, source archive, and digest manifest has a
          GitHub provenance attestation. See docs/release-provenance.md for
          verification commands and the provenance fields to inspect.
          EOF

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
